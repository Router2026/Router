sonar.projectKey=Router
sonar.projectName=Router
sonar.projectVersion=1.0

# ── Source roots ──────────────────────────────────────────────────────────────
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ── Language ──────────────────────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=coverage/backend/lcov.info,coverage/frontend/lcov.info
# Use the Sonar-compatible shim (project tsconfigs use TS5 options Sonar can't parse)
sonar.typescript.tsconfigPaths=tsconfig.sonar.json

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/public/**,\
  **/*.min.js,\
  **/migrations/**

# ── Coverage exclusions ───────────────────────────────────────────────────────
# Exclude files that cannot realistically be unit-tested:
# route handlers, frontend pages/components, DB infrastructure, external API clients
sonar.coverage.exclusions=\
  backend/src/app/**,\
  backend/src/middleware.ts,\
  backend/src/lib/db/**,\
  backend/src/lib/email/**,\
  backend/src/lib/ingestion/**,\
  backend/src/lib/notifications/**,\
  backend/src/lib/llm/anthropic.ts,\
  backend/src/lib/llm/ollama.ts,\
  backend/src/lib/llm/openai.ts,\
  backend/src/lib/location-images/**,\
  backend/src/lib/poi/**,\
  backend/src/lib/trip-bucket/mapbox-matrix.ts,\
  backend/src/lib/trip-bucket/smart-build.ts,\
  backend/src/lib/startup-check.ts,\
  backend/src/lib/trips/trip-service.ts,\
  backend/src/lib/public-trips/**,\
  frontend/src/pages/**,\
  frontend/src/components/**,\
  frontend/src/api.ts

# ── Server ────────────────────────────────────────────────────────────────────
# For local dev: set SONAR_HOST_URL and SONAR_TOKEN as environment variables,
# or override here (do NOT commit tokens to git).
# For CI: these are injected via GitHub secrets (see .github/workflows/ci.yml).
sonar.host.url=http://localhost:9000

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
