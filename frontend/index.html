<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/pwa-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Router</title>

    <!-- PWA / Home Screen -->
    <meta name="application-name" content="Router" />
    <meta name="theme-color" content="#0d9e6e" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="router" />
    <link rel="apple-touch-icon" href="/pwa-icon.jpg" />

    <!-- Open Graph / sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ראוטר — טיולים בטבע ישראל" />
    <meta property="og:description" content="גלה אתרי טבע, צור מסלולים ושתף חוויות בטבע הישראלי" />
    <meta property="og:image" content="/pwa-icon.jpg" />

    <!-- Supabase Storage CDN — hero image, gallery, markers -->
    <link rel="preconnect" href="https://YOUR_PROJECT_ID.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://YOUR_PROJECT_ID.supabase.co" />

    <!-- Supabase API / Auth -->
    <link rel="preconnect" href="https://YOUR_PROJECT_ID.supabase.co" />

    <!-- CARTO tile CDN — map tiles in MapView + POIDetail MiniMap -->
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://basemaps.cartocdn.com" />

    <!-- Google Fonts (Heebo) — if loaded from Google CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- OSRM routing (used by MiniMap route feature) -->
    <link rel="dns-prefetch" href="https://router.project-osrm.org" />

    <!--
      NOTE: Replace YOUR_PROJECT_ID with your actual Supabase project ID.
      Find it in: Supabase Dashboard → Settings → API → Project URL
      Example: abcdefghijklmnop.supabase.co
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
